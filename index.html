<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Communication OS</title>
<style>
/* ============================================================
   COMMUNICATION OS — v1.0.0
   Premium dark SaaS aesthetic. Developer-identity sidebar,
   modern dashboard content. Offline. No dependencies.
   ============================================================ */

:root{
  /* Surfaces */
  --bg:#0b0c10;
  --sidebar:#0e1014;
  --content:#0f1116;
  --surface:#16181f;
  --surface-2:#1b1e27;
  --surface-3:#222633;
  --hover:rgba(255,255,255,.04);

  /* Lines */
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.11);

  /* Text */
  --text:#e8eaf0;
  --text-2:#a5aab8;
  --text-3:#6c7280;

  /* Brand */
  --accent:#4ec9b0;
  --accent-2:#7c9dff;
  --accent-3:#b98cff;
  --success:#57c98a;
  --warning:#e8c37e;
  --error:#f0736f;

  /* Tiers */
  --t1:#4ec9b0; --t2:#67d3ff; --t3:#9aa2b1; --t4:#e8c37e; --t5:#f0736f;

  /* Effects */
  --grad-hero:linear-gradient(135deg,rgba(78,201,176,.20),rgba(124,157,255,.15) 52%,rgba(185,140,255,.13));
  --grad-accent:linear-gradient(135deg,#4ec9b0,#54cfc0);
  --grad-ring:linear-gradient(135deg,#4ec9b0,#7c9dff);
  --ring-track:rgba(255,255,255,.08);
  --sh-sm:0 1px 2px rgba(0,0,0,.35);
  --sh:0 8px 24px rgba(0,0,0,.28);
  --sh-lg:0 24px 60px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(78,201,176,.35),0 8px 30px rgba(78,201,176,.18);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,Consolas,Menlo,monospace;

  --sidebar-w:266px;
  --fs:16.5px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:var(--fs);line-height:1.65;
  height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.mono,code{font-family:var(--mono);}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;cursor:pointer;color:inherit;}
::selection{background:rgba(78,201,176,.28);}

::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:content-box;}

/* ============================================================ LAYOUT */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:44px 1fr 30px;
  grid-template-areas:"title title" "side editor" "status status";
  height:100vh;background:var(--bg);
}

/* ---- Title bar ---- */
.titlebar{
  grid-area:title;display:flex;align-items:center;gap:13px;padding:0 16px;
  background:rgba(14,16,20,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);user-select:none;
}
.traffic{display:flex;gap:8px;}
.traffic span{width:12px;height:12px;border-radius:50%;}
.traffic .r{background:#ff5f57;}.traffic .y{background:#febc2e;}.traffic .g{background:#28c840;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .logo{width:20px;height:20px;border-radius:6px;background:var(--grad-ring);box-shadow:var(--sh-sm);}
.filetitle{font-weight:650;font-size:14.5px;letter-spacing:-.01em;}
.filetitle b{color:var(--accent);font-weight:750;}
.ver{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:2px 7px;border-radius:6px;background:var(--surface);}
.spacer{flex:1;}
.cmdk-hint{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 11px;transition:.15s;
}
.cmdk-hint:hover{border-color:var(--border-2);color:var(--text);}
.hamburger{display:none;background:none;border:none;font-size:20px;padding:4px 8px;line-height:1;}

/* ---- Sidebar ---- */
.sidebar{
  grid-area:side;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-search{padding:14px 14px 10px;}
.side-search input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-size:13.5px;padding:10px 13px;border-radius:11px;outline:none;transition:.15s;
}
.side-search input:focus{border-color:var(--border-2);background:var(--surface-2);}
.side-search input::placeholder{color:var(--text-3);}
.side-scroll{overflow-y:auto;flex:1;padding:4px 0 24px;}

.nav-group{margin-bottom:6px;}
.nav-head{
  display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;text-align:left;
  color:var(--text-3);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:10px 18px 6px;
}
.nav-head .chev{font-size:9px;transition:transform .15s;width:9px;}
.nav-group.collapsed .chev{transform:rotate(-90deg);}
.nav-group.collapsed .nav-items{display:none;}
.nav-items{display:flex;flex-direction:column;gap:1px;}

.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;width:auto;margin:1px 8px;
  background:none;border:none;text-align:left;color:var(--text-2);font-size:14.5px;
  padding:9px 12px;border-radius:10px;min-height:38px;transition:background .12s,color .12s;
}
.nav-item .ico{width:18px;text-align:center;flex-shrink:0;font-size:14px;opacity:.95;}
.nav-item:hover{background:var(--hover);color:var(--text);}
.nav-item.active{background:var(--surface-2);color:#fff;box-shadow:var(--sh-sm);}
.nav-item.active::before{content:"";position:absolute;left:-2px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--grad-ring);}
.nav-item.sub{padding-left:20px;font-size:13.5px;color:var(--text-3);min-height:34px;margin:1px 10px;}
.nav-item.sub .ico{font-size:10px;opacity:.5;}
.nav-item.sub:hover{color:var(--text-2);}
.nav-item.sub.active{color:#fff;background:var(--surface-2);}
.nav-item .badge{margin-left:auto;font-size:11px;color:var(--success);}

/* ---- Editor / content ---- */
.editor{grid-area:editor;display:flex;flex-direction:column;background:var(--content);overflow:hidden;min-width:0;}
.tabbar{display:none;}
.breadcrumbs{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;height:52px;flex-shrink:0;
  padding:0 34px;font-size:13px;border-bottom:1px solid var(--border);
  background:rgba(15,17,22,.75);backdrop-filter:blur(8px);
}
.breadcrumbs .crumb{color:var(--text-2);}
.breadcrumbs .sep{color:var(--text-3);font-size:11px;}
.breadcrumbs .crumb.cur{color:var(--text);font-weight:600;}

.editor-scroll{overflow-y:auto;flex:1;scroll-behavior:smooth;}
.view{max-width:1000px;margin:0 auto;padding:34px 34px 120px;}

/* ---- Status bar (quiet, ambient) ---- */
.statusbar{
  grid-area:status;background:var(--sidebar);border-top:1px solid var(--border);
  display:flex;align-items:center;font-size:12px;color:var(--text-3);user-select:none;
}
.statusbar .seg{display:flex;align-items:center;gap:6px;padding:0 13px;height:100%;transition:.12s;}
.statusbar .seg:hover{color:var(--text-2);background:var(--hover);}
.statusbar .seg.muted{color:var(--text-3);}
.statusbar .spacer{flex:1;}

/* ============================================================ TYPOGRAPHY */
.h-page{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;}
.h-section{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:38px 0 16px;}
.h-sub{font-size:16px;font-weight:700;color:var(--text);margin:22px 0 9px;}
.lede{color:var(--text-2);font-size:16px;max-width:72ch;margin-bottom:26px;}
p{margin-bottom:13px;}
.view p{max-width:74ch;color:var(--text-2);}
.muted{color:var(--text-2);}
.faint{color:var(--text-3);}
strong,b{color:var(--text);font-weight:650;}
.hl{background:rgba(78,201,176,.16);color:var(--accent);border-radius:4px;padding:1px 5px;font-weight:600;}

/* ============================================================ HERO (dashboard) */
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:32px 34px;margin-bottom:24px;
  background:var(--grad-hero),var(--surface);border:1px solid var(--border);box-shadow:var(--sh);
  display:flex;gap:28px;align-items:center;justify-content:space-between;
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 100% 0%,rgba(124,157,255,.14),transparent 60%);pointer-events:none;}
.hero-main{position:relative;z-index:1;max-width:60ch;}
.hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.hero-title{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px;}
.hero-sub{font-size:16px;color:var(--text-2);margin-bottom:22px;max-width:52ch;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:6px 12px;}
.chip b{color:var(--text);font-weight:600;}
.hero-side{position:relative;z-index:1;flex-shrink:0;}

/* ---- Progress ring ---- */
.ring{position:relative;width:150px;height:150px;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:11;}
.ring .fill{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-val{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.ring-lbl{font-size:11.5px;color:var(--text-2);margin-top:5px;text-transform:uppercase;letter-spacing:.06em;}

/* ============================================================ CARDS / GRID */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--sh-sm);}
.card.accent{background:linear-gradient(180deg,rgba(78,201,176,.07),transparent 55%),var(--surface);border-color:rgba(78,201,176,.2);}
.grid{display:grid;gap:16px;margin-bottom:24px;}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g4{grid-template-columns:repeat(4,1fr);}

.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
  box-shadow:var(--sh-sm);transition:transform .15s,border-color .15s;
}
button.stat{cursor:pointer;text-align:left;width:100%;}
button.stat:hover,.stat.hoverable:hover{transform:translateY(-2px);border-color:var(--border-2);}
.stat .k{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;font-weight:600;}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--text);}
.stat .v.sm{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.4;}
.stat .sub{font-size:12.5px;color:var(--text-3);margin-top:6px;}

/* ============================================================ TIER BADGES */
.tier{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;font-family:var(--mono);vertical-align:middle;}
.tier.t1{color:#08211c;background:var(--t1);}
.tier.t2{color:#052430;background:var(--t2);}
.tier.t3{color:var(--text-2);background:var(--surface-3);}
.tier.t4{color:#2a1f06;background:var(--t4);}
.tier.t5{color:#2c0a09;background:var(--t5);}

/* ============================================================ BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:600;min-height:44px;
  transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--grad-accent);color:#06231d;border-color:transparent;font-weight:700;box-shadow:0 6px 20px rgba(78,201,176,.22);}
.btn.primary:hover{box-shadow:0 10px 28px rgba(78,201,176,.32);}
.btn.success{background:transparent;color:var(--success);border-color:rgba(87,201,138,.4);}
.btn.success:hover{background:rgba(87,201,138,.1);}
.btn.warn{background:transparent;color:var(--warning);border-color:rgba(232,195,126,.4);}
.btn.warn:hover{background:rgba(232,195,126,.1);}
.btn.danger{background:transparent;color:var(--error);border-color:rgba(240,115,111,.4);}
.btn.danger:hover{background:rgba(240,115,111,.12);}
.btn.ghost{background:transparent;}
.btn.ghost:hover{background:var(--hover);}
.btn.sm{min-height:38px;padding:8px 14px;font-size:13.5px;border-radius:10px;}
.btn.big{min-height:52px;padding:15px 26px;font-size:16px;border-radius:14px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:11px;flex-wrap:wrap;}

/* ============================================================ FORMS */
label.fl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);font-weight:650;margin-bottom:8px;}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:15px;padding:12px 14px;border-radius:12px;outline:none;transition:.15s;
}
textarea{resize:vertical;min-height:96px;line-height:1.6;}
input:focus,textarea:focus,select:focus{border-color:rgba(78,201,176,.5);background:var(--surface-2);}
.field{margin-bottom:18px;}
.inline-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;}
.range-wrap{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;accent-color:var(--accent);height:6px;}
.range-val{font-family:var(--mono);font-size:16px;color:var(--accent);min-width:26px;text-align:center;font-weight:600;}
.checkbox-field{display:flex;align-items:center;}
.checkbox-field .cl{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text);font-weight:500;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;}
.checkbox-field input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;}
.chip-input{display:flex;gap:8px;margin-bottom:10px;}
.chip-input input{flex:1;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip.evc{background:rgba(78,201,176,.08);border-color:rgba(78,201,176,.25);color:var(--text);padding:6px 8px 6px 12px;}
.chip.evc button{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
.chip.evc button:hover{color:var(--error);}

/* ============================================================ LADDER EDITOR */
.ladder-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.ladder-row:last-child{border-bottom:none;}
.lr-pos{font-family:var(--mono);font-size:13px;color:var(--text-3);min-width:22px;padding-top:12px;flex:none;}
.lr-main{flex:1;min-width:0;}
.lr-main .lr-name{margin-bottom:6px;}
.lr-diff{display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-3);}
.ladder-rec{margin-top:8px;font-size:13px;color:var(--accent-2,var(--accent));background:rgba(78,201,176,.08);border:1px solid rgba(78,201,176,.2);border-radius:10px;padding:9px 12px;line-height:1.5;}
.lr-actions{display:flex;gap:6px;flex:none;padding-top:2px;}
.ladder-add{display:flex;gap:8px;margin-top:16px;}
.ladder-add input{flex:1;}

/* ============================================================ MODULE FIELDS */
.mfield{margin-bottom:20px;}
.mfield .flabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:8px;}
.mfield .ftext{color:var(--text);font-size:16px;line-height:1.7;}
.mfield ul{margin:8px 0 0 20px;}
.view ul,.view ol{margin:8px 0 14px 22px;}
.view li{margin-bottom:8px;color:var(--text-2);}
.view li::marker{color:var(--text-3);}
.check-list{list-style:none;margin-left:0!important;}
.check-list li{padding-left:28px;position:relative;}
.check-list li::before{content:"";position:absolute;left:0;top:7px;width:15px;height:15px;border:1.5px solid var(--success);border-radius:5px;}

.qref{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh-sm);}
.qref h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.qref .step{font-size:15px;color:var(--text-2);margin-bottom:9px;padding-left:2px;}
.qref .step b{color:var(--accent);font-weight:650;}

.rm{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh-sm);}
.rm .name{font-size:18px;font-weight:750;margin-bottom:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em;}
.rm .desc{font-size:13.5px;color:var(--text-3);margin-bottom:16px;}
.rm .row{display:grid;grid-template-columns:170px 1fr;gap:6px 18px;font-size:15px;margin-bottom:11px;}
.rm .row .l{color:var(--accent);font-weight:600;font-size:14px;}
.rm .row .t{color:var(--text-2);}

.ladder{display:flex;flex-direction:column;}
.ladder .rung{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);font-size:15px;}
.ladder .rung:last-child{border-bottom:none;}
.ladder .rung .n{font-family:var(--mono);color:var(--accent);width:26px;flex-shrink:0;font-size:13px;}
.ladder .rung .name{color:var(--text);}
.ladder .rung .tag{margin-left:auto;font-size:11px;font-family:var(--mono);}
.tag.done{color:var(--success);}
.tag.todo{color:var(--text-3);}

/* ============================================================ TABLES */
.tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:16px;margin-bottom:18px;background:var(--surface);box-shadow:var(--sh-sm);}
table.data{width:100%;border-collapse:collapse;font-size:14px;}
table.data th{background:transparent;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:650;padding:14px 16px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
table.data td{padding:13px 16px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top;}
table.data tr:last-child td{border-bottom:none;}
table.data td.strong{color:var(--text);font-weight:650;}
table.data tr:hover td{background:var(--hover);}
table.data .num{font-family:var(--mono);}

/* ============================================================ ROUTINE / TIMER */
.phase{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh-sm);transition:box-shadow .2s,border-color .2s;}
.phase.active{border-color:transparent;box-shadow:var(--glow);}
.phase.done{opacity:.6;}
.phase-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.phase-num{width:38px;height:38px;border-radius:11px;background:var(--surface-2);color:var(--accent);font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.phase.active .phase-num{background:var(--grad-accent);color:#06231d;}
.phase.done .phase-num{background:var(--success);color:#052414;}
.phase-title{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.phase-dur{font-family:var(--mono);color:var(--text-3);font-size:13px;}
.phase-status{margin-left:auto;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
.phase-status.s-done{color:var(--success);}
.phase-status.s-skip{color:var(--warning);}
.timer{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:1px;margin:8px 0 16px;color:var(--text);}
.timer.run{color:var(--accent);}
.timer.over{color:var(--warning);}
.phase-body{font-size:15px;color:var(--text-2);line-height:1.7;margin-bottom:16px;}
.phase-body .cue{margin-bottom:4px;}
.phase-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;font-size:13.5px;padding:14px 16px;background:var(--surface-2);border-radius:12px;}
.phase-meta .m .ml{color:var(--text-3);text-transform:uppercase;font-size:10px;letter-spacing:.05em;margin-bottom:4px;font-weight:600;}
.phase-meta .m{color:var(--text-2);}

/* ============================================================ TOASTS */
.toast-wrap{position:fixed;bottom:44px;right:22px;z-index:9000;display:flex;flex-direction:column;gap:11px;max-width:360px;}
.toast{
  background:var(--surface-2);border:1px solid var(--border-2);border-radius:14px;padding:14px 17px;
  font-size:14px;color:var(--text);box-shadow:var(--sh-lg);display:flex;align-items:flex-start;gap:11px;
  animation:tin .22s cubic-bezier(.2,.8,.2,1);
}
.toast .ti{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--surface-3);}
.toast.success .ti{background:rgba(87,201,138,.16);color:var(--success);}
.toast.error .ti{background:rgba(240,115,111,.16);color:var(--error);}
.toast.warn .ti{background:rgba(232,195,126,.16);color:var(--warning);}
.toast.leaving{animation:tout .2s forwards;}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
@keyframes tout{to{opacity:0;transform:translateY(8px);}}

/* ============================================================ MODAL */
.modal-back{position:fixed;inset:0;background:rgba(6,7,10,.66);backdrop-filter:blur(4px);z-index:9500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s;}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:20px;max-width:470px;width:100%;padding:28px;box-shadow:var(--sh-lg);animation:pop .2s cubic-bezier(.2,.8,.2,1);}
.modal h3{font-size:19px;font-weight:750;margin-bottom:11px;letter-spacing:-.01em;}
.modal p{color:var(--text-2);font-size:15px;margin-bottom:24px;}
.modal .btn-row{justify-content:flex-end;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:none;}}

/* ============================================================ COMMAND PALETTE */
.cmdk-back{position:fixed;inset:0;background:rgba(6,7,10,.6);backdrop-filter:blur(6px);z-index:9600;display:flex;justify-content:center;padding-top:12vh;animation:fade .16s;}
.cmdk{background:var(--surface);border:1px solid var(--border-2);border-radius:18px;width:min(620px,92vw);max-height:66vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-lg);animation:pop .2s cubic-bezier(.2,.8,.2,1);}
.cmdk-input{padding:16px 18px;border-bottom:1px solid var(--border);}
.cmdk-input input{font-size:16.5px;padding:11px 14px;border-radius:12px;}
.cmdk-results{overflow-y:auto;padding:8px;}
.cmdk-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;cursor:pointer;}
.cmdk-row .ico{width:22px;text-align:center;opacity:.85;}
.cmdk-row .txt .t{font-size:15px;color:var(--text);}
.cmdk-row .txt .c{font-size:12px;color:var(--text-3);}
.cmdk-row.sel,.cmdk-row:hover{background:var(--surface-2);}
.cmdk-empty{padding:30px;text-align:center;color:var(--text-3);font-size:14.5px;}
.cmdk-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);display:flex;gap:18px;}

/* ============================================================ CHARTS */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh-sm);}
.chart-card h3{font-size:16px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em;}
.chart-card .cnote{font-size:13px;color:var(--text-3);margin-bottom:16px;}
.chart-holder{position:relative;width:100%;}
canvas{display:block;width:100%;}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--text-2);}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block;}

/* ============================================================ MISC */
.empty{text-align:center;padding:60px 20px;}
.empty .big{font-size:44px;margin-bottom:16px;opacity:.65;}
.empty p{color:var(--text-2);max-width:46ch;margin:0 auto 20px;font-size:15.5px;}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-family:var(--mono);padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);}
.pill.ok{color:var(--success);border-color:rgba(87,201,138,.3);background:rgba(87,201,138,.08);}
.pill.no{color:var(--text-3);}
.hr{height:1px;background:var(--border);margin:26px 0;border:none;}
.tabs{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:4px;margin-bottom:26px;overflow-x:auto;max-width:100%;box-shadow:var(--sh-sm);}
.tabs button{background:none;border:none;border-radius:10px;color:var(--text-2);font-size:14px;font-weight:600;padding:9px 17px;white-space:nowrap;min-height:38px;transition:.12s;}
.tabs button.active{color:var(--text);background:var(--surface-2);box-shadow:var(--sh-sm);}
.tabs button:hover:not(.active){color:var(--text);}
.kbd{font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--text-2);}

/* ============================================================ RESPONSIVE */
.scrim{display:none;}
@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"title" "editor" "status";}
  .sidebar{position:fixed;top:44px;bottom:30px;left:0;width:min(84vw,320px);z-index:800;transform:translateX(-103%);transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh-lg);}
  .app.nav-open .sidebar{transform:none;}
  .app.nav-open .scrim{display:block;position:fixed;inset:44px 0 30px 0;background:rgba(6,7,10,.5);z-index:700;}
  .hamburger{display:block;}
  .view{padding:24px 18px 110px;}
  .breadcrumbs{padding:0 18px;}
  .grid.g3,.grid.g4,.grid.g2{grid-template-columns:1fr;}
  .hero{flex-direction:column;align-items:flex-start;padding:26px 22px;}
  .hero-side{align-self:center;}
  .rm .row{grid-template-columns:1fr;gap:2px;}
  .phase-meta{grid-template-columns:1fr;}
  .h-page{font-size:25px;}.hero-title{font-size:26px;}
  .timer{font-size:38px;}
  .cmdk-hint{display:none;}
  .ver{display:none;}
}
@media(max-width:520px){
  .inline-fields{grid-template-columns:1fr;}
  .statusbar .seg.hide-sm{display:none;}
  .grid.g4 .stat .v{font-size:24px;}
  .ladder-row{flex-wrap:wrap;}
  .lr-actions{width:100%;padding-left:36px;}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}

<script>
/* ============================================================================
   COMMUNICATION OS — v1.0.0
   A long-term communication training operating system.
   Offline · LocalStorage · No dependencies.
   ----------------------------------------------------------------------------
   SECTIONS
     1. CONFIG & CONTENT DATA
     2. UTILITIES

    10. ROUTINE TIMER ENGINE
    11. VIEWS: Learn (Modules)
    12. VIEWS: Reference Library
    13. VIEWS: Progress (Tracker / History / Analytics)
    14. ANALYTICS CHARTS (canvas)
    15. VIEWS: Settings
    16. SEARCH / COMMAND PALETTE
    17. INIT

'use strict';

/* ============================================================================
   1. CONFIG & CONTENT DATA
   ========================================================================== */

const CONFIG = Object.freeze({
  STORAGE_KEY: 'communication-os',
  VERSION: '2.0.0',
  TOTAL_WEEKS: 12,
  TOTAL_MODULES: 12,
  BACKUP_REMINDER_DAYS: 7,
  RECOMMEND_SAMPLE: 5,        // how many recent completed exposures a rung needs before we'll suggest reordering it

});

/* ---- Daily routine phases (from the 20-minute execution protocol) ---- */
const ROUTINE_PHASES = [
  {
    id: 'reset', num: 1, name: 'Diaphragmatic Reset', minutes: 4,
    instructions: [

  },
  {
    id: 'playback', num: 5, name: 'Playback & Self-Review', minutes: 2,
    instructions: [
      'Voice-memo one of today\u2019s reps on your phone. Play it back once.',

    ],

];

/* ---- Exposure ladder DEFAULTS ----------------------------------------
   This is only a SEED. The live, editable ladder lives in state.ladder
   (see Storage section) and is populated from this list the first time
   the app runs, or migrated in for older saves. Never read this array

const DEFAULT_LADDER = [
  { id: 'r1',  name: 'Order food in English (scripted)' },
  { id: 'r2',  name: 'Ask a stranger a directional question' },
  { id: 'r3',  name: 'Give a genuine compliment to a stranger' },
  { id: 'r4',  name: 'Small talk with a cashier, 3+ exchanges' },
  { id: 'r5',  name: 'Join a group conversation, one comment' },
  { id: 'r6',  name: 'One-on-one conversation with a woman' },
  { id: 'r7',  name: 'Real conversation using answer-first structure' },
  { id: 'r8',  name: 'Rhetorical pause in a real conversation' },
  { id: 'r9',  name: 'Real interruption, handled without a switch' },
  { id: 'r10', name: 'Public/group moment with full nonverbal congruence' },
  { id: 'r11', name: '3\u20135 minute talk to a real audience' },
  { id: 'r12', name: 'Real adversarial conversation' },
  { id: 'r13', name: 'Full-stack week: talk + 2 new conversations + adversarial + cold call' },
  { id: 'r14', name: 'Capstone talk to your largest real audience' }
];

/* ---- Frameworks (Reference Library) ---- */
const FRAMEWORKS = [
  {
    id: 'pace', name: 'PACE+ Recovery Protocol', tag: 't1',
    steps: [
      ['P \u2014 Pause', 'Stop completely, 1\u20132 sec. Don\u2019t push through a jumbled sentence.'],
      ['A \u2014 Accept', '"I\u2019m thinking," not "I\u2019m failing." Reset posture \u2014 shoulders back, jaw soft.'],
      ['C \u2014 Continue', 'Restart from your last complete idea, slower, in English, with an anchor phrase.'],
      ['E \u2014 End clean', 'Finish the sentence. No apology.'],

  },
  {
    id: 'prep', name: 'PREP Framework', tag: 't3',

  },
  {
    id: 'pyramid', name: 'Pyramid Principle', tag: 't3',

      ['Conclusion first', 'Conclusion \u2192 Because \u2192 For example \u2192 Therefore. Lead with the answer, not the journey to it.']
    ]
  },
  {
    id: 'feynman', name: 'Feynman Technique', tag: 't3',

  {
    id: 'story', name: 'Story Framework (STAR)', tag: 't3',

  {
    id: 'englishlock', name: 'English Lock Rule', tag: 't1',
    steps: [
      ['The rule', 'Once a sentence starts in English, it finishes in English \u2014 even mid-stumble.'],
      ['If you fully lose it', 'Pause, breathe, restart the sentence in English, never Pidgin.'],

/* ---- Role models ---- */
const ROLE_MODELS = [
  {
    name: 'Vusi Thembekwayo', desc: 'Business gravitas through structure and restraint',
    rows: [
      ['Tripartite structure', 'Point \u2192 Counterpoint \u2192 Synthesis. State a claim, name the strongest objection, resolve into a sharper final position.'],
      ['Metaphor-to-data ratio', 'Ground abstract claims in one concrete example before moving on \u2014 never left floating as theory.'],
      ['Deliberate pause', 'A 2\u20133 second silence immediately after a strong statement, before elaboration.']

  {
    name: 'Mehdi Hasan', desc: 'Interview logic and interruption control',
    rows: [

      ['The boundary', '"Let me finish this thought, then I\u2019ll take that\u2014" polite, firm, doesn\u2019t concede the floor.'],
      ['The deflection', '"That\u2019s a separate question \u2014 let\u2019s come back to it," for someone trying to derail rather than engage.']
    ]
  },
  {
    name: 'Vinh Giang', desc: 'Vocal mechanics as trainable motor skill',
    rows: [
      ['Yawn-Ahhh', 'Start a yawn, hold the lifted soft palate, voice an "ahh" \u2014 opens the resonance space a tight, anxious throat closes off.'],
      ['Lip trills to rhythm', 'Hum lip trills to a song\u2019s melody \u2014 builds steady breath support without forcing volume.'],
      ['Over-articulation', 'Exaggerate every consonant reading aloud, then repeat at normal pace holding the same jaw opening.']
    ]

/* ---- Recovery: decision trees & trigger map (Reference) ---- */
const RECOVERY = {
  scenarios: [
    { sit: 'Forgot the sentence mid-way', tree: ['Pause \u2014 full stop, don\u2019t backfill with filler.', 'Restate your last complete idea in English.', 'Continue from there, slower. No apology.'] },
    { sit: 'Blanked completely', tree: ['One diaphragmatic breath \u2014 buys 2 seconds legitimately.', 'Say your conclusion again ("The point is\u2026") \u2014 it re-anchors you and the listener.', 'Rebuild from the conclusion outward.'] },
    { sit: 'Got interrupted', tree: ['Hold the floor: "Let me finish this thought, then I\u2019ll take that."', 'Finish your sentence in English.', 'Then engage the interruption on your terms.'] },
    { sit: 'Lost eye contact / looked away', tree: ['Don\u2019t announce it. Finish the current clause.', 'Re-anchor eye contact on the next sentence\u2019s first word.', 'Log it as a body-language cue for tomorrow\u2019s mirror rep.'] },

  ],
  triggerMap: [
    'Log every freeze/switch: who was present, the stakes, whether it was scripted.',
    'Look for the pattern \u2014 is it a person type (women, authority), a topic, or unscriptedness?',
    'The trigger, once named, becomes your next exposure-ladder target.'
  ],
  examples: [
    ['"If I switch, they\u2019ll think I\u2019m uneducated."', 'My degree is a fact. Pidgin is a habit, not a deficit.'],
    ['"Everyone noticed that freeze."', 'On playback, my "obvious" freeze was a 1-second pause nobody flagged.'],
    ['"I need to feel calm before I speak."', 'The exposure creates the calm. Waiting to feel ready is the trap.']
  ]

/* ---- FAQ ---- */
const FAQ = [
  { q: 'What if I skip a week?', a: 'Nothing breaks. This is an operating system, not a countdown. Resume at the module you were on \u2014 don\u2019t restart from zero, and don\u2019t "make up" skipped days by doubling. Consistency over weeks beats intensity over days. If you skip, run a Minimum Viable Day to keep the habit alive: one breath reset, one exposure, one tracker entry.' },
  { q: 'What is a Minimum Viable Day?', a: 'The smallest version of the practice that still counts. On a bad day: 4 minutes of box breathing, one small exposure (even rung 1\u20132), and a single tracker line. It protects the streak and the identity ("I am someone who does this") without demanding the full 20-minute routine. A Minimum Viable Day is a win, not a failure.' },
  { q: 'How do I know I\u2019m improving?', a: 'Not by how you feel in the moment \u2014 feeling is a bad instrument here. Improvement shows up in the data: recovery rate climbing, anxiety-after dropping below anxiety-before, exposure rung progression, and your Week-1-vs-now baseline recording. Trust the Analytics tab over your memory of a single bad conversation.' },
  { q: 'What if a freeze happens in a real, high-stakes moment?', a: 'Run PACE+ exactly as drilled: Pause, Accept, Continue in English, End clean. You don\u2019t have to win the argument with your anxiety in the moment \u2014 if the reframe doesn\u2019t land live, use it in the post-mortem. Then log it. A logged freeze with a clean recovery is a success, not a setback.' },
  { q: 'Do I have to do the modules in order?', a: 'The first time through, roughly yes \u2014 breath and reframing (Modules 1\u20134) underpin everything above them. After that, this becomes a reference library: revisit any module when its skill feels rusty. Maintenance (Module 12) is meant to be re-read every few weeks indefinitely.' },
  { q: 'Is this a substitute for therapy?', a: 'No. This is educational and self-directed. If freezing, anxiety, or fluency issues feel severe or persistent, a licensed speech-language pathologist or therapist can tailor this far more precisely to you. Verify any technique here independently.' }

/* ---- Rotating daily quotes ---- */
const QUOTES = [
  'This isn\u2019t a language problem \u2014 it\u2019s a performance-under-pressure pattern.',
  'Breathe \u2192 speak in English \u2192 recover clean if you freeze. In that order.',
  'The exposure creates the calm. It is not a precondition for it.',
  'A logged freeze with a clean recovery is a success, not a setback.',
  'You replace a habit \u2014 you don\u2019t just remove one.',
  'Slower, paired with eye contact, reads as control \u2014 not hesitation.',
  'Lead with the answer, not the journey to it.',
  'Absence of a freeze is still data. Log the quiet days too.',
  'The restart-language is always English. No exceptions.',
  'Completion matters, not the outcome.',
  'Your writing is already fluent. That\u2019s evidence the gap is stress, not competence.',
  'Finishing the program is the start of maintenance, not the finish line.'
];

/* ---- Scientific appendix ---- */
const APPENDIX = [
  ['Diaphragmatic breathing', 'Lowers sympathetic (fight-or-flight) arousal before a speech task begins.', 't1', 'Standard respiratory-support technique in speech-language pathology.', 'Before any practice block or real exposure.', 'That it needs to be dramatic \u2014 small, quiet belly breaths work better.'],
  ['Graded exposure hierarchy', 'Repeated, ranked exposure to a feared situation extinguishes the fear response over time.', 't1', 'Wolpe\u2019s systematic desensitization; one of the most replicated findings in behavioral psychology.', 'Structuring the whole exposure ladder.', 'That you must feel calm before a rung \u2014 the exposure itself creates the calm.'],
  ['Cognitive restructuring', 'Disputing an automatic negative thought reduces its power to trigger a freeze.', 't1', 'Core CBT technique (Beck), decades of replication across anxiety disorders.', 'Module 1 reframes, and any recurring freeze-thought.', 'That positive thinking alone is the goal \u2014 the reframe must be evidence-based.'],
  ['Habit reversal training', 'Awareness plus a deliberate competing response breaks an automatic loop.', 't1', 'Azrin & Nunn, applied behavior analysis \u2014 first-line for tics and verbal habits.', 'Filler words and Pidgin-switching.', 'That awareness alone fixes the habit \u2014 it only sets up the competing response.'],
  ['Vocal Function Exercises', 'Systematic exercises build controlled projection without vocal strain.', 't1', 'Stemple protocol, standard in SLP voice therapy.', 'Breath & Voice work; any weak resonance.', 'That louder is always better \u2014 the goal is supported, not forced, volume.'],
  ['Relapse prevention planning', 'Pre-identifying high-risk situations prevents drift back to old patterns.', 't1', 'Marlatt & Gordon, CBT maintenance-phase protocol.', 'Maintenance module, and ongoing.', 'That finishing the program means the work is done.'],

/* ============================================================================
   2. UTILITIES
   ========================================================================== */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clamp(n, lo, hi){ n = Number(n); if(Number.isNaN(n)) n = lo; return Math.min(hi, Math.max(lo, n)); }
function todayISO(){ return new Date().toISOString(); }
function dayKey(d){ const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  if(!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ', ' +
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function relDays(iso){
  if(!iso) return '\u2014';
  const diff = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(diff <= 0) return 'today';
  if(diff === 1) return 'yesterday';
  return diff + ' days ago';
}
function mmss(sec){
  const neg = sec < 0; sec = Math.abs(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return (neg?'+':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function debounce(fn, ms){
  let t; return function(...a){ clearTimeout(t); t = setTimeout(() => fn.apply(this,a), ms); };
}
function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

/* ============================================================================
   2b. LADDER HELPERS (read-only accessors \u2014 all mutation happens in the
   Settings > Ladder editor, and always goes through save()/saveNow())
   ========================================================================== */
function getLadder(){ return state.ladder.slice().sort((a,b) => a.order - b.order); }
function rungById(id){ return state.ladder.find(r => r.id === id) || null; }
function rungName(id){ const r = rungById(id); return r ? r.name : '(deleted rung)'; }
function rungPosition(id){ const ord = getLadder(); const i = ord.findIndex(r => r.id === id); return i < 0 ? null : i + 1; }

/* ============================================================================
   3. STORAGE
   ========================================================================== */
function defaultState(){
  return {
    version: CONFIG.VERSION,
    created: todayISO(),
    settings: { currentDay: 1, currentWeek: 1, lastBackupAt: null },
    moduleCompletions: {},   // { m1: ISO, ... }
    reflections: {},         // { m1: "text", ... }
    sessions: [],            // routine session logs
    // ladder: user-editable, seeded from DEFAULT_LADDER. `order` is the stable
    // Display Order (manual, only changes when the user reorders it).
    ladder: DEFAULT_LADDER.map((r, i) => ({ id: r.id, name: r.name, order: i })),
    exposureLogs: []         // exposure attempts \u2014 see exposureLogShape() below for the structured fields
  };
}

/* Canonical shape of one exposure log entry, per the frozen spec. Kept as one
   place so validateState/migrateState/the form all agree on field names. */
function exposureLogShape(overrides){
  return Object.assign({
    id: uid(),
    date: todayISO(),
    rungId: '',
    target: '',
    predictedAnxiety: 5,
    actualBefore: 5,
    actualAfter: 5,
    difference: 0,
    freezeCount: 0,
    englishOnly: true,
    recovered: true,
    recoveryMethod: '',
    evidence: [],
    notes: ''
  }, overrides || {});
}

/* Validate the *shape* of an imported / stored object against the CURRENT
   (v2.0.0) schema. Assumes migrateState() has already run. Returns a clean
   state or null \u2014 never throws, never trusts the input. */
function validateState(obj){
  if(!obj || typeof obj !== 'object') return null;
  if(typeof obj.version !== 'string') return null;
  const clean = defaultState();
  clean.version = obj.version;
  clean.created = typeof obj.created === 'string' ? obj.created : todayISO();
  if(obj.settings && typeof obj.settings === 'object'){
    clean.settings.currentDay  = clamp(obj.settings.currentDay ?? 1, 1, 100000);
    clean.settings.currentWeek = clamp(obj.settings.currentWeek ?? 1, 1, CONFIG.TOTAL_WEEKS);
    clean.settings.lastBackupAt = typeof obj.settings.lastBackupAt === 'string' ? obj.settings.lastBackupAt : null;
  }
  if(obj.moduleCompletions && typeof obj.moduleCompletions === 'object' && !Array.isArray(obj.moduleCompletions)){
    for(const k of Object.keys(obj.moduleCompletions)){
      if(/^m\d{1,2}$/.test(k) && typeof obj.moduleCompletions[k] === 'string') clean.moduleCompletions[k] = obj.moduleCompletions[k];
    }
  }
  if(obj.reflections && typeof obj.reflections === 'object' && !Array.isArray(obj.reflections)){
    for(const k of Object.keys(obj.reflections)){
      if(/^m\d{1,2}$/.test(k) && typeof obj.reflections[k] === 'string') clean.reflections[k] = String(obj.reflections[k]).slice(0, 8000);
    }
  }
  if(Array.isArray(obj.sessions)){
    clean.sessions = obj.sessions.filter(s => s && typeof s === 'object' && typeof s.date === 'string').map(s => ({
      id: typeof s.id === 'string' ? s.id : uid(),
      date: s.date,
      type: s.type === 'routine' ? 'routine' : 'routine',
      phases: Array.isArray(s.phases) ? s.phases.map(p => ({ id:String(p.id||''), name:String(p.name||''), status: p.status === 'skip' ? 'skip' : 'done' })) : [],
      completedCount: clamp(s.completedCount ?? 0, 0, 99),
      skippedCount: clamp(s.skippedCount ?? 0, 0, 99),
      durationPlanned: clamp(s.durationPlanned ?? 0, 0, 100000),
      notes: typeof s.notes === 'string' ? s.notes.slice(0,2000) : ''
    }));
  }

  // ---- Ladder: array of {id, name, order}. Falls back to the default seed
  // if missing/malformed, so an old or corrupt save still boots into a usable ladder.
  if(Array.isArray(obj.ladder) && obj.ladder.length){
    const seen = new Set();
    clean.ladder = obj.ladder
      .filter(r => r && typeof r === 'object' && typeof r.id === 'string' && typeof r.name === 'string' && r.name.trim())
      .map((r, i) => ({ id: r.id, name: r.name.slice(0, 300), order: clamp(r.order ?? i, 0, 100000) }))
      .filter(r => { if(seen.has(r.id)) return false; seen.add(r.id); return true; })
      .sort((a,b) => a.order - b.order)
      .map((r, i) => ({ ...r, order: i })); // renumber to a clean, gapless 0..n-1 sequence
  }
  const validIds = new Set(clean.ladder.map(r => r.id));

  // ---- Exposure logs: structured fields only, per the frozen spec.
  if(Array.isArray(obj.exposureLogs)){
    clean.exposureLogs = obj.exposureLogs
      .filter(e => e && typeof e === 'object' && typeof e.date === 'string')
      .map(e => {
        const rungId = (typeof e.rungId === 'string' && validIds.has(e.rungId)) ? e.rungId : (clean.ladder[0] ? clean.ladder[0].id : '');
        const actualBefore = clamp(e.actualBefore ?? 5, 1, 10);
        const actualAfter  = clamp(e.actualAfter ?? 5, 1, 10);
        return {
          id: typeof e.id === 'string' ? e.id : uid(),
          date: e.date,
          rungId,
          target: typeof e.target === 'string' ? e.target.slice(0, 500) : '',
          predictedAnxiety: clamp(e.predictedAnxiety ?? actualBefore, 1, 10),
          actualBefore,
          actualAfter,
          difference: actualAfter - actualBefore,
          freezeCount: clamp(e.freezeCount ?? 0, 0, 999),
          englishOnly: typeof e.englishOnly === 'boolean' ? e.englishOnly : true,
          recovered: typeof e.recovered === 'boolean' ? e.recovered : true,
          recoveryMethod: typeof e.recoveryMethod === 'string' ? e.recoveryMethod.slice(0, 200) : '',
          evidence: Array.isArray(e.evidence) ? e.evidence.filter(x => typeof x === 'string').map(x => x.slice(0,300)).slice(0, 50) : [],
          notes: typeof e.notes === 'string' ? e.notes.slice(0,2000) : ''
        };
      });
  }
  return clean;
}

/* ----------------------------------------------------------------------
   Migrations. Each function transforms the PREVIOUS version's raw object
   into the NEXT version's shape. migrateState() chains whichever of these
   apply, then validateState() does the final defensive clean/clamp pass.
   This is the seam future versions hook into \u2014 add a migrateTo_X_Y_Z()
   and one more `if` below it; never delete an old one.
   ---------------------------------------------------------------------- */

/* v1.0.0 -> v2.0.0: introduces the editable ladder and the rich exposure-log
   schema. Every old field is preserved somewhere \u2014 nothing is silently
   dropped, even where the old shape doesn't map 1:1 onto the new one. */
function migrateTo_2_0_0(obj){
  // Build the ladder: v1 had no state.ladder at all, so seed it from the
  // same defaults the app always shipped with.
  const ladder = DEFAULT_LADDER.map((r, i) => ({ id: r.id, name: r.name, order: i }));

  const exposureLogs = Array.isArray(obj.exposureLogs) ? obj.exposureLogs.map(e => {
    // Old logs stored a 1-based numeric `rung` against the fixed array position.
    const oldRung = clamp(e.rung ?? 1, 1, ladder.length);
    const rung = ladder[oldRung - 1] || ladder[0];
    // Old schema had no distinct "predicted" anxiety (felt before deciding to
    // attempt it) vs "actual before" (felt right before doing it) \u2014 only one
    // "before" value. Use it for both; it's the closest honest default.
    const actualBefore = clamp(e.anxietyBefore ?? 5, 1, 10);
    const actualAfter  = clamp(e.anxietyAfter ?? 5, 1, 10);
    // Old `recovery` was a 3-state enum (clean/partial/none); new schema is a
    // boolean + free-text method. Map clean/partial -> recovered, and fold the
    // "partial" nuance into notes rather than lose it.
    const recovered = e.recovery !== 'none';
    const partialNote = e.recovery === 'partial' ? '[migrated: recovery was partial]' : '';
    const notes = [typeof e.notes === 'string' ? e.notes : '', partialNote].filter(Boolean).join(' ').trim();
    return exposureLogShape({
      id: typeof e.id === 'string' ? e.id : uid(),
      date: e.date,
      rungId: rung.id,
      target: typeof e.rungName === 'string' && e.rungName ? e.rungName : rung.name,
      predictedAnxiety: actualBefore,
      actualBefore,
      actualAfter,
      difference: actualAfter - actualBefore,
      freezeCount: clamp(e.freezeCount ?? 0, 0, 999),
      englishOnly: true,        // not tracked pre-2.0.0; default per spec
      recovered,
      recoveryMethod: '',       // not tracked pre-2.0.0
      evidence: [],             // not tracked pre-2.0.0
      notes
    });
  }) : [];

  return Object.assign({}, obj, { version: '2.0.0', ladder, exposureLogs });
}

/* Migrate older schema versions forward, one step at a time. */
function migrateState(obj){
  if(!obj || typeof obj !== 'object') return obj;
  if(obj.version === '1.0.0'){ obj = migrateTo_2_0_0(obj); }
  // Next migration hooks in here, e.g.:
  // if(obj.version === '2.0.0'){ obj = migrateTo_2_1_0(obj); }
  return obj;
}

const Storage = {
  load(){
    let raw;
    try { raw = localStorage.getItem(CONFIG.STORAGE_KEY); }
    catch(e){ toast('Storage is unavailable \u2014 progress won\u2019t be saved this session.', 'error'); return defaultState(); }
    if(!raw) return defaultState();
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch(e){
      // Corrupted JSON: preserve the bad copy, start clean rather than crash.
      try { localStorage.setItem(CONFIG.STORAGE_KEY + '-corrupt-' + Date.now(), raw); } catch(_){}
      toast('Saved data was unreadable and has been reset. A backup copy was kept.', 'error');
      return defaultState();
    }
    const migrated = migrateState(parsed);
    const valid = validateState(migrated);
    if(!valid){
      try { localStorage.setItem(CONFIG.STORAGE_KEY + '-corrupt-' + Date.now(), raw); } catch(_){}
      toast('Saved data was in an unexpected format and has been reset.', 'error');
      return defaultState();
    }
    return valid;
  },
  _writeNow(st){
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(st)); }
    catch(e){ toast('Could not save \u2014 storage may be full.', 'error'); }
  },
  export(st){
    const name = 'communication-os-' + dayKey(new Date()) + '.json';
    download(name, JSON.stringify(st, null, 2), 'application/json');
  },
  reset(){
    try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch(e){}
  }
};

/* ============================================================================
   4. APP STATE & DERIVED STATISTICS
   ========================================================================== */
let state = defaultState();
const _debouncedWrite = debounce(() => Storage._writeNow(state), 220);
function save(){ _debouncedWrite(); }
function saveNow(){ Storage._writeNow(state); }

function moduleKey(num){ return 'm' + num; }
function isModuleDone(num){ return !!state.moduleCompletions[moduleKey(num)]; }

function activeDates(){
  const set = new Set();
  state.sessions.forEach(s => set.add(dayKey(s.date)));
  state.exposureLogs.forEach(e => set.add(dayKey(e.date)));
  return set;
}
function computeStreak(){
  const dates = activeDates();
  if(dates.size === 0) return 0;
  let streak = 0;
  const cur = new Date();
  // grace: if nothing today but something yesterday, streak still counts from yesterday
  if(!dates.has(dayKey(cur))){
    cur.setDate(cur.getDate() - 1);
    if(!dates.has(dayKey(cur))) return 0;
  }
  while(dates.has(dayKey(cur))){ streak++; cur.setDate(cur.getDate() - 1); }
  return streak;
}
/* Highest Display-Order position any logged exposure currently maps to.
   Uses the *current* ladder order, so if the user reorders rungs later this
   reflects that \u2014 there's no separate "historical position" to keep in sync. */
function highestRungPos(){
  let m = 0;
  state.exposureLogs.forEach(e => { const p = rungPosition(e.rungId); if(p && p > m) m = p; });
  return m;
}
/* Suggests which rung to preselect in the log form. This never writes
   anything \u2014 it's a computed default, not a ladder mutation. */
function currentRungId(){
  const ladder = getLadder();
  if(!ladder.length) return null;
  const h = highestRungPos();
  if(h === 0) return ladder[0].id;
  const topRung = ladder[h-1] || ladder[ladder.length-1];
  const atTop = state.exposureLogs.filter(e => e.rungId === topRung.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const latest = atTop[0];
  if(latest && latest.actualAfter <= 4 && latest.recovered && h < ladder.length) return ladder[h].id;
  return topRung.id;
}
function currentRungPos(){ return rungPosition(currentRungId()) || 1; }
function recoveryRate(logs){
  logs = logs || state.exposureLogs;
  if(!logs.length) return null;
  const recovered = logs.filter(e => e.recovered === true).length;
  return Math.round((recovered / logs.length) * 100);
}
function withinDays(iso, n){ return (Date.now() - new Date(iso)) <= n * 86400000; }

function getStats(){
  const s = state.sessions.slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  const e30 = state.exposureLogs.filter(x => withinDays(x.date, 30));
  const s30 = state.sessions.filter(x => withinDays(x.date, 30));
  const avg = (arr, k) => arr.length ? Math.round(arr.reduce((t,x)=>t+x[k],0)/arr.length*10)/10 : null;
  return {
    day: state.settings.currentDay,
    week: state.settings.currentWeek,
    moduleNum: clamp(state.settings.currentWeek, 1, CONFIG.TOTAL_MODULES),
    modulesDone: Object.keys(state.moduleCompletions).length,
    rung: currentRungPos(),
    rungId: currentRungId(),
    highestRung: highestRungPos(),
    recovery: recoveryRate(),
    recovery30: recoveryRate(e30),
    streak: computeStreak(),
    lastSession: s[0] ? s[0].date : null,
    sessionsTotal: state.sessions.length,
    exposuresTotal: state.exposureLogs.length,
    sessions30: s30.length,
    exposures30: e30.length,
    anxBefore30: avg(e30,'actualBefore'),
    anxAfter30: avg(e30,'actualAfter'),
    evidenceToday: state.exposureLogs.filter(e => dayKey(e.date) === dayKey(new Date())).reduce((t,e) => t + (Array.isArray(e.evidence) ? e.evidence.length : 0), 0)
  };
}

/* ---- Ladder mutation helpers (the ONLY functions allowed to change
   state.ladder \u2014 always user-triggered, never automatic) ---- */
function ladderAddRung(name){
  name = String(name || '').trim();
  if(!name) return false;
  const maxOrder = state.ladder.reduce((m,r) => Math.max(m, r.order), -1);
  state.ladder.push({ id: uid(), name: name.slice(0,300), order: maxOrder + 1 });
  return true;
}
function ladderRenameRung(id, name){
  name = String(name || '').trim();
  if(!name) return false;
  const r = rungById(id);
  if(!r) return false;
  r.name = name.slice(0,300);
  return true;
}
function ladderRemoveRung(id){
  state.ladder = state.ladder.filter(r => r.id !== id);
  // renumber so order stays a clean, gapless sequence
  getLadder().forEach((r, i) => { rungById(r.id).order = i; });
  return true;
}
function ladderMove(id, dir){ // dir: -1 up, +1 down
  const ordered = getLadder();
  const i = ordered.findIndex(r => r.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= ordered.length) return false;
  const a = ordered[i], b = ordered[j];
  const tmp = a.order; rungById(a.id).order = rungById(b.id).order; rungById(b.id).order = tmp;
  return true;
}
/* Current Difficulty (SUDS-style): purely informational, recomputed from
   ratings every render. Deliberately NOT the same thing as Display Order,
   which only moves when the user drags/clicks a rung \u2014 this can bounce
   around session to session without the UI feeling unstable, because it's
   shown as a badge, not a position. */
function rungDifficulty(id){
  const logs = state.exposureLogs.filter(e => e.rungId === id);
  if(!logs.length) return null;
  const avg = logs.reduce((t,e)=>t+e.actualAfter,0) / logs.length;
  return { avg: Math.round(avg*10)/10, n: logs.length };
}
/* Conservative, advisory-only recommendation. Never applied automatically \u2014
   the Ladder editor just shows this as a suggestion the user can act on or ignore. */
function ladderRecommendation(id){
  const logs = state.exposureLogs.filter(e => e.rungId === id).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(logs.length < CONFIG.RECOMMEND_SAMPLE) return null;
  const recent = logs.slice(0, CONFIG.RECOMMEND_SAMPLE);
  const avgAfter = recent.reduce((t,e)=>t+e.actualAfter,0) / recent.length;
  if(avgAfter > CONFIG.RECOMMEND_THRESHOLD) return null;
  const pos = rungPosition(id);
  if(pos === 1) return null; // already at the top of the ladder
  return 'This situation has averaged ' + (Math.round(avgAfter*10)/10) + '/10 anxiety over the last ' + recent.length + ' completed exposures. Consider moving it lower in your ladder.';
}

/* ============================================================================
   5. TOASTS & MODALS
   ========================================================================== */
function toast(msg, type){
  const wrap = $('#toastWrap');
  if(!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  const icon = type === 'success' ? '\u2713' : type === 'error' ? '\u2715' : type === 'warn' ? '!' : '\u2192';
  t.innerHTML = '<span class="ti">' + icon + '</span><span>' + esc(msg) + '</span>';
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('leaving');
    setTimeout(() => t.remove(), 200);
  }, 3400);
}

function confirmModal(opts){
  const root = $('#modalRoot');
  root.innerHTML =
    '<div class="modal-back" id="modalBack">' +
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + esc(opts.title) + '</h3>' +
        '<p>' + esc(opts.body) + '</p>' +

let _teardown = null;

function parseHash(){
  const raw = (location.hash || '#/dashboard').replace(/^#\//,'');
  return raw.split('/').filter(Boolean);
}

function render(){
  if(_teardown){ try { _teardown(); } catch(e){} _teardown = null; }
  const seg = parseHash();
  const root = seg[0] || 'dashboard';
  let meta;
  try {
    switch(root){
      case 'dashboard': meta = viewDashboard(); break;
      case 'session':   meta = viewSession(seg[1] || 'routine'); break;
      case 'learn':     meta = seg[1] ? viewModule(seg[1]) : viewLearnList(); break;
      case 'reference': meta = viewReference(seg[1] || 'frameworks'); break;
      case 'progress':  meta = viewProgress(seg[1] || 'tracker'); break;
      case 'settings':  meta = viewSettings(); break;
      default:          location.hash = '#/dashboard'; return;
    }
  } catch(err){
    console.error(err);
    meta = { file:'error', breadcrumb:['Error'], html:'<div class="empty"><div class="big">\u26A0</div><p>Something went wrong rendering this view. Your data is safe. Try reloading.</p></div>' };
  }
  const view = $('#view');
  view.innerHTML = meta.html;
  updateChrome(meta);
  $('#editorScroll').scrollTop = 0;
  if(meta.mount){ _teardown = meta.mount(view) || null; }
  // pending scroll (settings sub-nav)
  if(window.__scrollTo){
    const tgt = $('#' + window.__scrollTo);
    window.__scrollTo = null;
    if(tgt) tgt.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  // close mobile nav after navigation
  $('#app').classList.remove('nav-open');
}

function navigate(hash){ if(location.hash === hash){ render(); } else { location.hash = hash; } }

/* ============================================================================
   9. VIEW: TODAY'S SESSION  +  10. ROUTINE TIMER ENGINE
   ========================================================================== */
let routineState = null;   // ephemeral per-session progress; survives tab switches
let routineInterval = null;
let routineViewMounted = false;     // true only while the Daily Routine sub-view is on screen
let routineAutoPausedIndex = -1;    // phase index auto-paused by backgrounding the browser tab, so we know to resume only that

function initRoutine(force){
  if(force || !routineState){
    routineState = ROUTINE_PHASES.map(p => ({ status:'pending', remaining:p.minutes*60, running:false }));
  }
}
function routineResolvedCount(){ return routineState.filter(p => p.status !== 'pending').length; }

function viewSession(tab){
  const tabs = ['routine','module','exposure'];
  if(tabs.indexOf(tab) < 0) tab = 'routine';
  const labels = { routine:'Daily Routine', module:'Current Module', exposure:'Current Exposure' };
  const tabHtml = '<div class="tabs">' + tabs.map(t =>
    '<button class="' + (t === tab ? 'active' : '') + '" data-route="#/session/' + t + '">' + labels[t] + '</button>'
  ).join('') + '</div>';

  let body = '', mountFn = null;
  if(tab === 'routine'){ const r = sessionRoutine(); body = r.html; mountFn = r.mount; }
  else if(tab === 'module'){ body = sessionModule(); }
  else { const e = sessionExposure(); body = e.html; mountFn = e.mount; }

  return {
    file: 'session/' + tab + '.md',
    breadcrumb: ["Today's Session", labels[tab]],
    html: '<h1 class="h-page">\u25B6 Today\u2019s Session</h1>' + tabHtml + '<div id="sessionBody">' + body + '</div>',
    mount(view){ return mountFn ? mountFn(view) : null; }
  };
}

/* ---- Daily Routine sub-view ---- */
function sessionRoutine(){
  initRoutine(false);
  return {
    html:
      '<p class="lede">Five phases, 20 minutes. Run each timer, complete or skip on your own terms \u2014 nothing auto-advances. Finishing logs a session to your history.</p>' +
      '<div id="phaseList">' + renderPhaseList() + '</div>' +
      '<div class="btn-row" style="margin-top:8px">' +
        '<button class="btn primary" id="finishSession">Finish &amp; log session</button>' +
        '<button class="btn ghost" id="resetRoutine">Reset routine</button>' +
        '<span class="pill" id="routineProgress" style="align-self:center">' + routineResolvedCount() + ' / 5 phases</span>' +
      '</div>',
    mount(view){
      wireRoutine(view);
      routineViewMounted = true;
      if(routineInterval) clearInterval(routineInterval);
      routineInterval = setInterval(routineTick, 1000);
      return () => {
        routineViewMounted = false;
        routineAutoPausedIndex = -1;
        if(routineInterval){ clearInterval(routineInterval); routineInterval = null; }
      };
    }
  };
}

/* Pause the running phase the moment the browser tab is backgrounded (not just when you
   navigate to another in-app section, which already stops the interval via the mount
   teardown above) \u2014 and resume it, and only it, once the tab is visible again. */
document.addEventListener('visibilitychange', () => {
  if(!routineViewMounted || !routineState) return;
  if(document.hidden){
    const i = routineState.findIndex(p => p.running);
    if(i >= 0){
      routineState[i].running = false;
      routineAutoPausedIndex = i;
    }
    if(routineInterval){ clearInterval(routineInterval); routineInterval = null; }
  } else {
    if(routineAutoPausedIndex >= 0 && routineState[routineAutoPausedIndex]){
      routineState[routineAutoPausedIndex].running = true;
      routineAutoPausedIndex = -1;
    }
    if(!routineInterval) routineInterval = setInterval(routineTick, 1000);
    refreshPhaseList();
  }
});

function renderPhaseList(){
  return ROUTINE_PHASES.map((p, i) => {
    const rs = routineState[i];
    const cls = rs.status === 'done' ? 'done' : (rs.running ? 'active' : '');
    const statusTag = rs.status === 'done' ? '<span class="phase-status s-done">completed</span>'
                    : rs.status === 'skip' ? '<span class="phase-status s-skip">skipped</span>' : '';
    const timerCls = rs.running ? 'run' : (rs.remaining < 0 ? 'over' : '');
    return '<div class="phase ' + cls + '" data-i="' + i + '">' +
      '<div class="phase-top">' +
        '<div class="phase-num">' + p.num + '</div>' +
        '<div><div class="phase-title">' + esc(p.name) + '</div><div class="phase-dur">' + p.minutes + ' min guide</div></div>' +
        statusTag +
      '</div>' +
      '<div class="timer ' + timerCls + '" id="timer-' + i + '">' + mmss(rs.remaining) + '</div>' +
      '<div class="phase-body">' + p.instructions.map(x => '<div class="cue">\u2022 ' + esc(x) + '</div>').join('') + '</div>' +
      '<div class="phase-meta">' +
        '<div class="m"><div class="ml">Common mistake</div>' + esc(p.mistake) + '</div>' +
        '<div class="m"><div class="ml">Success cue</div>' + esc(p.cue) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn sm" data-r="start" data-i="' + i + '"' + (rs.running ? ' disabled' : '') + '>Start</button>' +
        '<button class="btn sm" data-r="pause" data-i="' + i + '"' + (!rs.running ? ' disabled' : '') + '>Pause</button>' +
        '<button class="btn sm ghost" data-r="reset" data-i="' + i + '">Reset</button>' +
        '<button class="btn sm warn" data-r="skip" data-i="' + i + '">Skip</button>' +
        '<button class="btn sm success" data-r="complete" data-i="' + i + '">Complete</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function refreshPhaseList(){
  const el = $('#phaseList');
  if(el){ el.innerHTML = renderPhaseList(); wirePhaseButtons(el); }
  const prog = $('#routineProgress');
  if(prog) prog.textContent = routineResolvedCount() + ' / 5 phases';
}

function wireRoutine(view){
  wirePhaseButtons(view);
  const finish = $('#finishSession', view);
  if(finish) finish.onclick = finishSession;
  const reset = $('#resetRoutine', view);
  if(reset) reset.onclick = () => confirmModal({
    title:'Reset routine?', body:'This clears the timers and phase progress for the current routine. It won\u2019t touch your logged history.',
    confirmLabel:'Reset', onConfirm:() => { initRoutine(true); refreshPhaseList(); toast('Routine reset.'); }
  });
}
function wirePhaseButtons(root){
  $$('[data-r]', root).forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.i), act = btn.dataset.r, rs = routineState[i];
      if(act === 'start'){ routineState.forEach(p => p.running = false); rs.running = true; rs.status = 'pending'; }
      else if(act === 'pause'){ rs.running = false; }
      else if(act === 'reset'){ rs.running = false; rs.remaining = ROUTINE_PHASES[i].minutes*60; rs.status = 'pending'; }
      else if(act === 'skip'){ rs.running = false; rs.status = 'skip'; }
      else if(act === 'complete'){ rs.running = false; rs.status = 'done'; }
      refreshPhaseList();
    };
  });
}
function routineTick(){
  if(!routineState) return;
  const i = routineState.findIndex(p => p.running);
  if(i < 0) return;
  routineState[i].remaining -= 1;
  const span = $('#timer-' + i);
  if(span){
    span.textContent = mmss(routineState[i].remaining);
    span.className = 'timer ' + (routineState[i].remaining < 0 ? 'over' : 'run');
  }
}
function finishSession(){
  const resolved = routineResolvedCount();
  const doIt = () => {
    const phases = ROUTINE_PHASES.map((p,i) => ({ id:p.id, name:p.name, status: routineState[i].status === 'done' ? 'done' : 'skip' }));
    const done = phases.filter(p => p.status === 'done').length;
    state.sessions.push({
      id: uid(), date: todayISO(), type:'routine', phases,
      completedCount: done, skippedCount: 5 - done,
      durationPlanned: ROUTINE_PHASES.reduce((t,p)=>t+p.minutes,0), notes:''
    });
    save();
    initRoutine(true);
    refreshPhaseList();
    renderStatusBar();
    buildNav();
    toast('Session saved to history.', 'success');
  };
  if(resolved < 5){
    confirmModal({ title:'Finish with unfinished phases?', body:'You have ' + (5-resolved) + ' phase(s) still pending. Finishing now logs them as skipped.', confirmLabel:'Log session', onConfirm:doIt });
  } else doIt();
}

/* ---- Current Module sub-view ---- */
function sessionModule(){
  const num = clamp(state.settings.currentWeek, 1, CONFIG.TOTAL_MODULES);
  const m = MODULES[num-1];

    '</div>' +
    '<div class="inline-fields">' +
      '<div class="field checkbox-field"><label class="cl"><input type="checkbox" id="exEnglish" checked> Stayed in English throughout</label></div>' +
      '<div class="field checkbox-field"><label class="cl"><input type="checkbox" id="exRecovered" checked> Recovered (didn\u2019t stay frozen/stuck)</label></div>' +
    '</div>' +

      '<div class="chip-input"><input type="text" id="exEvidenceInput" placeholder="e.g. Stayed in English"><button type="button" class="btn sm" id="exEvidenceAdd">Add</button></div>' +
      '<div class="chip-list" id="exEvidenceList"></div>' +
    '</div>' +

  '</div>';

function renderEvidenceChips(root){
  const box = $('#exEvidenceList', root);
  if(!box) return;
  box.innerHTML = _exEvidenceDraft.map((ev,i) =>
    '<span class="chip evc"><span>' + esc(ev) + '</span><button type="button" data-rm="' + i + '" aria-label="Remove">\u00d7</button></span>'
  ).join('');
  $$('[data-rm]', box).forEach(b => { b.onclick = () => { _exEvidenceDraft.splice(Number(b.dataset.rm),1); renderEvidenceChips(root); }; });
}
function wireExposureForm(root){
  if(!$('#exRung', root)) return null;   // ladder is empty; nothing to wire
  _exEvidenceDraft = [];
  renderEvidenceChips(root);
  const bind = (id, vid) => { const s = $('#'+id, root), v = $('#'+vid, root); if(s&&v){ s.oninput = () => v.textContent = s.value; } };
  bind('exPredicted','exPredictedV'); bind('exBefore','exBeforeV'); bind('exAfter','exAfterV');

  const addEvidence = () => {
    const inp = $('#exEvidenceInput', root);
    const v = (inp.value || '').trim();
    if(!v) return;
    _exEvidenceDraft.push(v.slice(0,300));
    inp.value = '';
    renderEvidenceChips(root);
    inp.focus();
  };
  const addBtn = $('#exEvidenceAdd', root);
  if(addBtn) addBtn.onclick = addEvidence;
  const evInput = $('#exEvidenceInput', root);
  if(evInput) evInput.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); addEvidence(); } };

  const save = $('#exSave', root);
  if(save) save.onclick = () => {
    const rungId = $('#exRung', root).value;
    if(!rungId){ toast('Pick a rung first.', 'warn'); return; }
    const actualBefore = clamp($('#exBefore', root).value,1,10);
    const actualAfter = clamp($('#exAfter', root).value,1,10);
    state.exposureLogs.push(exposureLogShape({
      date: todayISO(),
      rungId,
      target: ($('#exTarget', root).value || '').trim().slice(0,500) || rungName(rungId),
      predictedAnxiety: clamp($('#exPredicted', root).value,1,10),
      actualBefore,
      actualAfter,
      difference: actualAfter - actualBefore,
      freezeCount: clamp($('#exFreeze', root).value,0,999),
      englishOnly: !!$('#exEnglish', root).checked,
      recovered: !!$('#exRecovered', root).checked,
      recoveryMethod: ($('#exMethod', root).value || '').trim().slice(0,200),
      evidence: _exEvidenceDraft.slice(),
      notes: ($('#exNotes', root).value || '').trim().slice(0,2000)
    }));
    saveNow();
    _exEvidenceDraft = [];
    toast('Exposure logged.', 'success');
    navigate(location.hash);   // re-render current view to reflect new data
  };
  return null;
}
function renderExposureRecent(limit){
  const logs = state.exposureLogs.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0, limit);
  if(!logs.length) return '<div class="empty"><div class="big">\uD83E\uDE9C</div><p>No exposures logged yet. Attempt your current rung and record it above \u2014 the first entry starts your trend.</p></div>';
  return '<div class="tbl-scroll"><table class="data"><thead><tr><th>Date</th><th>Rung</th><th>Target</th><th>Before</th><th>After</th><th>Freeze</th><th>Recovered</th></tr></thead><tbody>' +
    logs.map(e => '<tr><td>' + fmtDate(e.date) + '</td><td class="strong">' + (rungPosition(e.rungId) || '\u2014') + '</td><td>' + esc(e.target || rungName(e.rungId)) + '</td><td class="num">' + e.actualBefore + '</td><td class="num">' + e.actualAfter + '</td><td class="num">' + e.freezeCount + '</td><td>' + recoveryPill(e.recovered) + '</td></tr>').join('') +
    '</tbody></table></div>';
}
function recoveryPill(recovered){
  return recovered ? '<span class="pill ok">recovered</span>' : '<span class="pill no">not yet</span>';
}

function wireModuleBody(root){
  const ta = $('#mReflect', root);
  if(ta){
    const deb = debounce(() => { state.reflections[moduleKey(Number(ta.dataset.module))] = ta.value.slice(0,8000); save(); }, 400);
    ta.oninput = deb;
  }
  const btn = $('#mComplete', root);
  if(btn) btn.onclick = () => {
    const num = Number(btn.dataset.module), key = moduleKey(num);
    if(state.moduleCompletions[key]){ delete state.moduleCompletions[key]; toast('Module marked incomplete.'); }
    else { state.moduleCompletions[key] = todayISO(); toast('Module complete \u2014 nice work.', 'success'); }
    saveNow();
    navigate(location.hash);
  };
}

let _historyPage = 0;

function viewProgress(sub){
  const subs = ['tracker','history','analytics'];
  if(subs.indexOf(sub) < 0) sub = 'tracker';
  const labels = { tracker:'Tracker', history:'Session History', analytics:'Analytics' };

    return '<div class="empty"><div class="big">\uD83E\uDE9C</div><p>Your exposure tracker is empty. Log your first attempt from Today\u2019s Session \u2192 Current Exposure, and it will appear here.</p><button class="btn primary" data-route="#/session/exposure">Log an exposure</button></div>';
  }
  const rows = logs.map(e =>
    '<tr><td>' + fmtDate(e.date) + '</td><td class="strong num">' + (rungPosition(e.rungId) || '\u2014') + '</td><td>' + esc(e.target || rungName(e.rungId)) + '</td>' +
    '<td class="num">' + e.predictedAnxiety + '</td><td class="num">' + e.actualBefore + '</td><td class="num">' + e.actualAfter + '</td>' +
    '<td class="num" style="color:' + (e.difference < 0 ? 'var(--success)' : e.difference > 0 ? 'var(--warning)' : 'var(--text-2)') + '">' + (e.difference > 0 ? '+' : '') + e.difference + '</td>' +

    '<div class="tbl-scroll"><table class="data"><thead><tr><th>Date</th><th>Rung</th><th>Target</th><th>Predicted</th><th>Before</th><th>After</th><th>\u0394</th><th>Freeze</th><th>English</th><th>Recovered</th><th>Method</th><th>Evidence</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="btn-row"><button class="btn sm" data-action="export-exposure-csv">Export exposures (CSV)</button></div>';
}

/* ---- Session history (paginated) ---- */
function progressHistory(){
  const PER = 20;
  const all = state.sessions.slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!all.length){
    return { html:'<div class="empty"><div class="big">\u25B6</div><p>No sessions logged yet. Finish a daily routine and it will appear here \u2014 the history builds the streak on your dashboard.</p><button class="btn primary" data-route="#/session/routine">Start a session</button></div>', mount(){} };
  }
  const pages = Math.ceil(all.length / PER);
  _historyPage = clamp(_historyPage, 0, pages - 1);
  const slice = all.slice(_historyPage*PER, _historyPage*PER + PER);
  const rows = slice.map(s => {
    const dur = s.durationPlanned ? s.durationPlanned + ' min' : '\u2014';
    return '<tr><td>' + fmtDateTime(s.date) + '</td><td class="strong num">' + s.completedCount + ' / 5</td>' +
      '<td class="num">' + s.skippedCount + '</td><td class="num">' + dur + '</td>' +
      '<td>' + s.phases.filter(p=>p.status==='done').map(p=>esc(p.name.split(' ')[0])).join(', ') + '</td></tr>';
  }).join('');
  const pager = pages > 1
    ? '<div class="btn-row" style="align-items:center"><button class="btn sm" data-action="hist-prev"' + (_historyPage===0?' disabled':'') + '>\u2190 Newer</button>' +
      '<span class="pill">Page ' + (_historyPage+1) + ' / ' + pages + '</span>' +
      '<button class="btn sm" data-action="hist-next"' + (_historyPage>=pages-1?' disabled':'') + '>Older \u2192</button></div>'
    : '';
  return {
    html: '<p class="lede">' + all.length + ' session' + (all.length===1?'':'s') + ' logged. Consistency here is what builds the streak \u2014 the count matters more than any single day.</p>' +
      '<div class="tbl-scroll"><table class="data"><thead><tr><th>When</th><th>Completed</th><th>Skipped</th><th>Planned</th><th>Phases done</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      pager +
      '<div class="btn-row"><button class="btn sm" data-action="export-sessions-csv">Export sessions (CSV)</button></div>',
    mount(view){
      const prev = $('[data-action="hist-prev"]', view), next = $('[data-action="hist-next"]', view);
      if(prev) prev.onclick = () => { _historyPage--; navigate(location.hash); };
      if(next) next.onclick = () => { _historyPage++; navigate(location.hash); };
    }
  };
}

/* ---- Analytics (canvas charts) ---- */

  }
  const html =
    '<p class="lede">The data your memory can\u2019t hold. Trust these trends over how any single conversation felt.</p>' +
