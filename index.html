/* ============================================================================
   14. ANALYTICS CHARTS (pure canvas 2D)
   ========================================================================== */
const CHART = { pad:{ t:16, r:14, b:28, l:34 }, grid:'rgba(255,255,255,0.06)', text:'#8a8f9e', font:'11px ui-monospace,Consolas,monospace' };

function setupCanvas(cv){
  if(!cv) return null;
  const holder = cv.parentElement;
  const cssW = holder.clientWidth || 600;
  const cssH = cv.height || 220;
  const dpr = window.devicePixelRatio || 1;
  cv.width = cssW * dpr; cv.height = cssH * dpr;
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  return { ctx, w:cssW, h:cssH };
}
function axes(ctx, w, h, yMin, yMax, yTicks, xLabels){
  const p = CHART.pad;
  const plotW = w - p.l - p.r, plotH = h - p.t - p.b;
  ctx.strokeStyle = CHART.grid; ctx.fillStyle = CHART.text; ctx.font = CHART.font; ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(let i=0;i<=yTicks;i++){
    const val = yMin + (yMax-yMin)*(i/yTicks);
    const y = p.t + plotH - plotH*(i/yTicks);
    ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(p.l, y); ctx.lineTo(p.l+plotW, y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(Math.round(val), p.l - 6, y);
  }
  if(xLabels && xLabels.length){
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const step = Math.max(1, Math.ceil(xLabels.length / 6));
    xLabels.forEach((lb, i) => {
      if(i % step !== 0 && i !== xLabels.length-1) return;
      const x = xLabels.length === 1 ? p.l + plotW/2 : p.l + plotW*(i/(xLabels.length-1));
      ctx.fillText(lb, x, p.t + plotH + 6);
    });
  }
  return { p, plotW, plotH };
}
function plotXY(p, plotW, plotH, i, n, val, yMin, yMax){
  const x = n === 1 ? p.l + plotW/2 : p.l + plotW*(i/(n-1));
  const y = p.t + plotH - plotH*((val - yMin)/(yMax - yMin || 1));
  return [x, y];
}
function line(ctx, pts, color, fill){
  if(!pts.length) return;
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach((pt,i) => i ? ctx.lineTo(pt[0],pt[1]) : ctx.moveTo(pt[0],pt[1])); ctx.stroke();
  ctx.fillStyle = color;
  pts.forEach(pt => { ctx.beginPath(); ctx.arc(pt[0],pt[1],2.6,0,7); ctx.fill(); });
}

function drawAnxietyChart(cv, exp){
  const s = setupCanvas(cv); if(!s) return;
  const { ctx, w, h } = s;
  const labels = exp.map(e => fmtDateShort(e.date));
  const g = axes(ctx, w, h, 0, 10, 5, labels);
  const before = exp.map((e,i) => plotXY(g.p, g.plotW, g.plotH, i, exp.length, e.actualBefore, 0, 10));
  const after  = exp.map((e,i) => plotXY(g.p, g.plotW, g.plotH, i, exp.length, e.actualAfter, 0, 10));
  line(ctx, before, '#e8c37e');
  line(ctx, after, '#4ec9b0');
}
function drawRecoveryChart(cv, exp){
  const s = setupCanvas(cv); if(!s) return;
  const { ctx, w, h } = s;
  let clean = 0;
  const series = exp.map((e,i) => { if(e.recovered) clean++; return Math.round(clean/(i+1)*100); });
  const labels = exp.map(e => fmtDateShort(e.date));
  const g = axes(ctx, w, h, 0, 100, 5, labels);
  const pts = series.map((v,i) => plotXY(g.p, g.plotW, g.plotH, i, series.length, v, 0, 100));
  line(ctx, pts, '#4ec9b0');
}
function drawRungChart(cv, exp){
  const s = setupCanvas(cv); if(!s) return;
  const { ctx, w, h } = s;
  const ladderLen = Math.max(1, getLadder().length);
  let peak = 0;
  const series = exp.map(e => { peak = Math.max(peak, rungPosition(e.rungId) || 0); return peak; });
  const labels = exp.map(e => fmtDateShort(e.date));
  const g = axes(ctx, w, h, 0, ladderLen, 7, labels);
  const pts = series.map((v,i) => plotXY(g.p, g.plotW, g.plotH, i, series.length, v, 0, ladderLen));
  line(ctx, pts, '#57c98a');
}
function drawActivityChart(cv, sessions){
  const s = setupCanvas(cv); if(!s) return;
  const { ctx, w, h } = s;
  // last 8 weeks buckets
  const weeks = 8;
  const now = new Date();
  const buckets = new Array(weeks).fill(0);
  const labels = [];
  for(let i=weeks-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate() - i*7);
    labels.push((d.getMonth()+1) + '/' + d.getDate());
  }
  sessions.forEach(se => {
    const diffWeeks = Math.floor((now - new Date(se.date)) / (7*86400000));
    if(diffWeeks >= 0 && diffWeeks < weeks) buckets[weeks-1-diffWeeks]++;
  });
  const maxV = Math.max(1, ...buckets);
  const g = axes(ctx, w, h, 0, maxV, Math.min(maxV,5), labels);
  const bw = g.plotW / weeks * 0.6;
  ctx.fillStyle = '#4ec9b0';
  buckets.forEach((v,i) => {
    const cx = g.p.l + g.plotW*(i/(weeks-1 || 1));
    const x = weeks === 1 ? g.p.l + g.plotW/2 - bw/2 : cx - bw/2;
    const bh = g.plotH * (v/maxV);
    ctx.fillRect(x, g.p.t + g.plotH - bh, bw, bh);
  });
}
function fmtDateShort(iso){ const d = new Date(iso); return (d.getMonth()+1) + '/' + d.getDate(); }

function csvCell(v){

function wireLadderEditor(view){

  $$('[data-act]', card).forEach(btn => {

      const id = btn.dataset.id, act = btn.dataset.act;
      if(act === 'rm'){
        confirmModal({
          title:'Remove this rung?', danger:true, confirmLabel:'Remove',
          body:'This removes it from your ladder. Exposures already logged against it stay in your tracker and history \u2014 they just won\u2019t point at a live rung anymore.',
          onConfirm:() => { ladderRemoveRung(id); saveNow(); refresh(); toast('Rung removed.'); }
        });
        return;
      }

    };
  });
  $$('.lr-name', card).forEach(inp => {
    inp.onchange = () => {

    if(ladderAddRung(newInput.value)){ saveNow(); refresh(); toast('Rung added.', 'success'); }
  };
  if(addBtn) addBtn.onclick = doAdd;
  if(newInput) newInput.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } };
}

let SEARCH_INDEX = [];
function buildSearchIndex(){
  const idx = [];
  idx.push({ icon:'\uD83C\uDFE0', title:'Dashboard', context:'Overview', route:'#/dashboard', text:'dashboard stats streak recovery quote' });
  idx.push({ icon:'\u25B6', title:'Daily Routine', context:"Today's Session", route:'#/session/routine', text:'routine timer breath phases session' });
  idx.push({ icon:'\uD83E\uDE9C', title:'Current Exposure', context:"Today's Session", route:'#/session/exposure', text:'exposure ladder log anxiety rung attempt' });
  idx.push({ icon:'\uD83D\uDCC8', title:'Tracker', context:'Progress', route:'#/progress/tracker', text:'tracker exposure log table history' });
  idx.push({ icon:'\uD83D\uDCCA', title:'Analytics', context:'Progress', route:'#/progress/analytics', text:'analytics charts anxiety recovery trend' });
  idx.push({ icon:'\u2699', title:'Settings', context:'App', route:'#/settings', text:'settings export import reset backup day week' });
  MODULES.forEach(m => idx.push({ icon:'\uD83D\uDCDA', title:m.num + '. ' + m.title, context:'Learn', route:'#/learn/m'+m.num, text:(m.title + ' ' + m.subtitle + ' ' + m.objective + ' ' + m.why).toLowerCase() }));
  FRAMEWORKS.forEach(f => idx.push({ icon:'\uD83E\uDDE9', title:f.name, context:'Frameworks', route:'#/reference/frameworks', text:(f.name + ' ' + f.steps.map(s=>s[0]+' '+s[1]).join(' ')).toLowerCase() }));
  ROLE_MODELS.forEach(r => idx.push({ icon:'\uD83C\uDFAD', title:r.name, context:'Role Models', route:'#/reference/rolemodels', text:(r.name + ' ' + r.desc).toLowerCase() }));
  RECOVERY.scenarios.forEach(s => idx.push({ icon:'\uD83D\uDEDF', title:s.sit, context:'Recovery', route:'#/reference/recovery', text:(s.sit + ' ' + s.tree.join(' ')).toLowerCase() }));
  FAQ.forEach(f => idx.push({ icon:'\u2753', title:f.q, context:'FAQ', route:'#/reference/faq', text:(f.q + ' ' + f.a).toLowerCase() }));
  SEARCH_INDEX = idx;
}
function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const terms = q.split(/\s+/);
  return SEARCH_INDEX.map(it => {
    const hay = (it.title + ' ' + it.context + ' ' + it.text).toLowerCase();
    let score = 0;
    for(const t of terms){
      if(!hay.includes(t)) return null;
      if(it.title.toLowerCase().includes(t)) score += 3;
      if(it.context.toLowerCase().includes(t)) score += 1;
      score += 1;
    }
    return { it, score };
  }).filter(Boolean).sort((a,b)=> b.score - a.score).slice(0, 20).map(x => x.it);
}

let cmdkSel = 0, cmdkResults = [];
function openCmdk(seed){
  const root = $('#cmdkRoot');
  root.innerHTML =
    '<div class="cmdk-back" id="cmdkBack"><div class="cmdk">' +
      '<div class="cmdk-input"><input type="text" id="cmdkInput" placeholder="Search modules, frameworks, recovery, FAQ\u2026" autocomplete="off" spellcheck="false"></div>' +
      '<div class="cmdk-results" id="cmdkResults"></div>' +
      '<div class="cmdk-foot"><span><span class="kbd">\u2191\u2193</span> navigate</span><span><span class="kbd">\u21B5</span> open</span><span><span class="kbd">esc</span> close</span></div>' +
    '</div></div>';
  const input = $('#cmdkInput');
  input.value = seed || '';
  const close = () => { root.innerHTML = ''; };
  $('#cmdkBack').onclick = (e) => { if(e.target.id === 'cmdkBack') close(); };
  const update = () => {
    cmdkResults = runSearch(input.value);
    cmdkSel = 0;
    renderCmdkResults();
  };
  input.oninput = update;
  input.onkeydown = (e) => {
    if(e.key === 'Escape'){ close(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); cmdkSel = Math.min(cmdkResults.length-1, cmdkSel+1); renderCmdkResults(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdkSel = Math.max(0, cmdkSel-1); renderCmdkResults(); }
    else if(e.key === 'Enter'){ const r = cmdkResults[cmdkSel]; if(r){ close(); navigate(r.route); } }
  };
  update();
  setTimeout(() => input.focus(), 20);
}
function renderCmdkResults(){

  if(!cmdkResults.length){ box.innerHTML = '<div class="cmdk-empty">No matches. Try a different word \u2014 like "breath", "interrupt", or "ladder".</div>'; return; }
  box.innerHTML = cmdkResults.map((r,i) =>
    '<div class="cmdk-row ' + (i === cmdkSel ? 'sel' : '') + '" data-i="' + i + '"><span class="ico">' + r.icon + '</span>' +

}

function handleDelegatedClick(e){
  const routeEl = e.target.closest('[data-route]');
  if(routeEl){ navigate(routeEl.dataset.route); return; }
  const actEl = e.target.closest('[data-action]');
  if(actEl){
    const a = actEl.dataset.action;
    if(a === 'start-session') navigate('#/session/routine');
    else if(a === 'export'){ Storage.export(state); state.settings.lastBackupAt = todayISO(); saveNow(); toast('Backup exported.', 'success'); }
    else if(a === 'export-exposure-csv') exportExposureCSV();
    else if(a === 'export-sessions-csv') exportSessionsCSV();
  }
}
function handleNavToggle(e){
  const head = e.target.closest('[data-toggle]');
  if(!head) return;
  const key = head.dataset.toggle;
  collapsed[key] = !collapsed[key];
  buildNav();
}

function init(){
  state = Storage.load();
  buildSearchIndex();
  buildNav();

  // Global listeners (attached once)
  window.addEventListener('hashchange', render);

  document.addEventListener('click', (e) => {
    handleNavToggle(e);
    handleDelegatedClick(e);
  });

  const hb = $('#hamburger');
  if(hb) hb.onclick = () => $('#app').classList.toggle('nav-open');
  const scrim = $('#scrim');
  if(scrim) scrim.onclick = () => $('#app').classList.remove('nav-open');

  const cmdkOpen = $('#cmdkOpen');
  if(cmdkOpen) cmdkOpen.onclick = () => openCmdk('');
  const sideSearch = $('#sideSearch');
  if(sideSearch){
    sideSearch.addEventListener('focus', () => { sideSearch.blur(); openCmdk(''); });
  }

  window.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openCmdk(''); }
  });

  if(!location.hash) location.hash = '#/dashboard';
  render();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
</body>
</html>
